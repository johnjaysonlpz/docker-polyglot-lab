secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_chat_id:
    file: ./secrets/telegram_chat_id

services:
  alertmanager:
    volumes: !override
      - alertmanager-data:/alertmanager
      - ./alertmanager/alertmanager.yaml.tpl:/etc/alertmanager/alertmanager.yaml.tpl:ro
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - toolbox:/tools:ro
    environment:
      SECRETS_DIR: /run/secrets
      TOKEN_FILE: /run/secrets/telegram_bot_token
      CHAT_ID_FILE: /run/secrets/telegram_chat_id
    secrets:
      - telegram_bot_token
      - telegram_chat_id
