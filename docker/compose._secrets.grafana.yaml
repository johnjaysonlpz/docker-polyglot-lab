secrets:
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

services:
  grafana:
    entrypoint:
      - /bin/sh
      - -ec
      - |
          u=/run/secrets/grafana_admin_user p=/run/secrets/grafana_admin_password
          [ -s "$$u" ] && export GF_SECURITY_ADMIN_USER="$$(tr -d '\r\n' <"$$u")"
          [ -s "$$p" ] && export GF_SECURITY_ADMIN_PASSWORD="$$(tr -d '\r\n' <"$$p")"
          exec /run.sh
    environment: !override
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_METRICS_ENABLED: "true"
    secrets:
      - grafana_admin_user
      - grafana_admin_password
