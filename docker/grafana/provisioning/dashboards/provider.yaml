apiVersion: 1

providers:
  - name: polyglot-lab-dashboards
    orgId: 1
    folder: polyglot-lab
    type: file

    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 10

    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
