server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: ${TOMCAT_INTERNAL_PROXIES:127\\.0\\.0\\.1|::1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}}

spring:
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:5s}
  application:
    name: ${SERVICE_NAME:java-springboot-app}
  threads:
    virtual:
      enabled: true
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoint:
    health:
      probes:
        enabled: true

  observations:
    enable:
      http:
        server:
          requests: false

  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web.servlet.PageNotFound: OFF

app:
  service-name: ${SERVICE_NAME:java-springboot-app}
  version: ${VERSION:0.0.0-dev}
  build-time: ${BUILD_TIME:unknown}
  host: ${HOST:0.0.0.0}
  port: ${PORT:8080}
  shutdown-timeout: ${SHUTDOWN_TIMEOUT:5s}
  tomcat-connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:5s}
  tomcat-keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:120s}
  tomcat-max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
  tomcat-accept-count: ${TOMCAT_ACCEPT_COUNT:100}
  tomcat-max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
  tomcat-max-threads: ${TOMCAT_MAX_THREADS:200}
  tomcat-min-spare-threads: ${TOMCAT_MIN_SPARE_THREADS:10}
  max-body-bytes: ${MAX_BODY_BYTES:1048576}
