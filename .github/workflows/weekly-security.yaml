name: Weekly Security

on:
  workflow_dispatch:
  schedule:
    - cron: "00 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy_repo:
    name: Security - Trivy (repo) + SARIF
    uses: ./.github/workflows/_trivy_repo.yaml
    with:
      upload_sarif: true
      gate_on_findings: true
      allow_fork_pr_sarif: true
      artifact_name: trivy-repo-weekly
      sarif_category: trivy-repo-weekly

  docker_weekly:
    name: Docker - Trivy image (weekly) - ${{ matrix.service_name }}
    uses: ./.github/workflows/_trivy_image.yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: golang-gin-app
            context: ./golang-gin
            image_ref: local/golang-gin-app:${{ github.sha }}
          - service_name: java-springboot-app
            context: ./java-springboot
            image_ref: local/java-springboot-app:${{ github.sha }}
          - service_name: python-django-app
            context: ./python-django
            image_ref: local/python-django-app:${{ github.sha }}
    with:
      context: ${{ matrix.context }}
      image_ref: ${{ matrix.image_ref }}
      service_name: ${{ matrix.service_name }}
      gate_on_findings: true
      upload_sarif: true
      artifact_name: trivy-image-weekly-${{ matrix.service_name }}
      sarif_category: trivy-image-weekly-${{ matrix.service_name }}
      mode: local

  govulncheck_weekly:
    name: Security - govulncheck (weekly)
    uses: ./.github/workflows/_govulncheck.yaml
    with:
      working_directory: golang-gin
      gate: true
      artifact_name: go-gin-govulncheck-weekly

  pip_audit_weekly:
    name: Security - pip-audit (weekly)
    uses: ./.github/workflows/_pip_audit.yaml
    with:
      working_directory: python-django
      gate: true
      artifact_name: python-django-pip-audit-weekly

  dependency_check_weekly:
    name: Security - OWASP Dependency-Check (weekly)
    uses: ./.github/workflows/_dependency_check.yaml
    with:
      working_directory: java-springboot
      gate: true
      artifact_name: java-springboot-dependency-check-weekly
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
