name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI_MAINTAINERS: "johnjaysonlpz otheruser"
  GO_COVERAGE_MIN: "100"
  PY_COVERAGE_MIN: "100"
  JAVA_COVERAGE_MIN_RATIO: "1.0"

jobs:
  changes:
    name: Changes - detect touched areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      ci: ${{ steps.final.outputs.ci }}
      security: ${{ steps.final.outputs.security }}
      golang: ${{ steps.final.outputs.golang }}
      java: ${{ steps.final.outputs.java }}
      python: ${{ steps.final.outputs.python }}
    steps:
      - name: Detect - tag release or manual run (force run)
        id: tag
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notice - force run skips checkout/path filter
        if: ${{ steps.tag.outputs.all == 'true' }}
        run: |
          set -Eeuo pipefail
          echo "Force run: skipping checkout + paths-filter; all jobs enabled."

      - name: Checkout (push/PR)
        if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && steps.tag.outputs.all != 'true' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter - changed paths
        id: paths
        if: ${{ steps.tag.outputs.all != 'true' }}
        uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd # v3.0.0
        with:
          token: ${{ github.token }}
          filters: |
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.bootstrap-local.sh'
              - '.ci-tool-versions.sh'
              - '.ci-local.sh'
            golang:
              - 'golang-gin/**'
            java:
              - 'java-springboot/**'
            python:
              - 'python-django/**'
            security:
              - 'golang-gin/**'
              - 'java-springboot/**'
              - 'python-django/**'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.bootstrap-local.sh'
              - '.ci-tool-versions.sh'
              - '.ci-local.sh'

      - name: Compute - final changed areas outputs
        id: final
        env:
          FORCE_ALL: ${{ steps.tag.outputs.all }}
          PATHS_CI: ${{ steps.paths.outputs.ci }}
          PATHS_SECURITY: ${{ steps.paths.outputs.security }}
          PATHS_GOLANG: ${{ steps.paths.outputs.golang }}
          PATHS_JAVA: ${{ steps.paths.outputs.java }}
          PATHS_PYTHON: ${{ steps.paths.outputs.python }}
        run: |
          set -Eeuo pipefail

          ci=false
          security=false
          golang=false
          java=false
          python=false

          if [[ "${FORCE_ALL}" == "true" ]]; then
            ci=true
            security=true
            golang=true
            java=true
            python=true
          else
            PATHS_CI="${PATHS_CI:-false}"
            PATHS_SECURITY="${PATHS_SECURITY:-false}"
            PATHS_GOLANG="${PATHS_GOLANG:-false}"
            PATHS_JAVA="${PATHS_JAVA:-false}"
            PATHS_PYTHON="${PATHS_PYTHON:-false}"

            if [[ "${PATHS_CI}" == "true" ]]; then ci=true; fi
            if [[ "${PATHS_CI}" == "true" || "${PATHS_SECURITY}" == "true" ]]; then security=true; fi
            if [[ "${PATHS_CI}" == "true" || "${PATHS_GOLANG}" == "true" ]]; then golang=true; fi
            if [[ "${PATHS_CI}" == "true" || "${PATHS_JAVA}" == "true" ]]; then java=true; fi
            if [[ "${PATHS_CI}" == "true" || "${PATHS_PYTHON}" == "true" ]]; then python=true; fi
          fi

          echo "ci=${ci}" >> "$GITHUB_OUTPUT"
          echo "security=${security}" >> "$GITHUB_OUTPUT"
          echo "golang=${golang}" >> "$GITHUB_OUTPUT"
          echo "java=${java}" >> "$GITHUB_OUTPUT"
          echo "python=${python}" >> "$GITHUB_OUTPUT"

  policy:
    name: Policy - protect CI control files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Policy - noop (non-PR)
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Policy check skipped (not a PR)."

      - name: Checkout (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block PRs that modify CI control files (fork-safe; deterministic; fail-closed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ACTOR: ${{ github.actor }}
          MAINTAINERS: ${{ env.CI_MAINTAINERS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail

          maintainers="$(echo "${MAINTAINERS:-}" | tr '\n\t' '  ' | xargs)"
          if echo " $maintainers " | grep -Fq " ${ACTOR} "; then
            echo "Maintainer bypass: ${ACTOR}"
            exit 0
          fi

          protected_regex='^(\.bootstrap-local\.sh$|\.ci-tool-versions\.sh$|\.ci-local\.sh$|\.github/workflows/|\.github/actions/)'

          base_sha="${BASE_SHA}"
          head_sha="${HEAD_SHA}"

          git fetch --no-tags --prune --depth=50 origin "${base_sha}" "${head_sha}" || {
            echo "ERROR: unable to fetch base/head SHAs (fail-closed)." >&2
            exit 2
          }

          git cat-file -e "${base_sha}^{commit}" || { echo "ERROR: base_sha not a commit (fail-closed)." >&2; exit 2; }
          git cat-file -e "${head_sha}^{commit}" || { echo "ERROR: head_sha not a commit (fail-closed)." >&2; exit 2; }

          echo "Diff range: ${base_sha}...${head_sha}"

          changed="$(git diff --name-only "${base_sha}...${head_sha}")" || {
            echo "ERROR: unable to compute diff (fail-closed)." >&2
            exit 2
          }

          if [[ -z "${changed//[[:space:]]/}" ]]; then
            echo "OK: no file changes detected."
            exit 0
          fi

          if echo "$changed" | grep -E "$protected_regex" >/dev/null; then
            echo "ERROR: This PR modifies protected CI control files:"
            echo "$changed" | grep -E "$protected_regex" || true
            echo
            echo "Please open a separate PR or request maintainer assistance."
            exit 1
          fi

          echo "OK: no protected CI control files modified."

  dependency_review:
    name: Security - dependency review (PR only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [ policy ]
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4.0.0
        with:
          fail-on-severity: moderate

  trivy_repo:
    name: Security - Trivy (repo) + SARIF
    needs: [ policy, changes ]
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.security == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy_repo.yaml
    with:
      upload_sarif: true
      gate_on_findings: true
      allow_fork_pr_sarif: false
      artifact_name: trivy-repo-ci
      sarif_category: trivy-repo-ci

  go:
    name: Go / Gin - quality, tests, security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ policy, changes ]
    if: needs.changes.outputs.golang == 'true'
    defaults:
      run:
        working-directory: golang-gin
        shell: bash
    env:
      GOIMPORTS_VERSION: ""
      GOVULNCHECK_VERSION: ""
      GOLANGCI_LINT_VERSION: ""
      GO_MODULE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${GOIMPORTS_VERSION:?GOIMPORTS_VERSION is empty}"
          : "${GOVULNCHECK_VERSION:?GOVULNCHECK_VERSION is empty}"
          : "${GOLANGCI_LINT_VERSION:?GOLANGCI_LINT_VERSION is empty}"

      - name: Setup - Go toolchain
        id: go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: golang-gin/go.mod
          cache-dependency-path: golang-gin/go.sum
          check-latest: false

      - name: Cache - Go tools (goimports, govulncheck)
        id: cache_go_tools
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/go/bin
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ env.GOIMPORTS_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Setup - install Go dev tools (goimports, govulncheck)
        if: steps.cache_go_tools.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Setup - add Go tools to PATH
        run: |
          set -Eeuo pipefail
          GOBIN="$(go env GOBIN)"
          if [[ -z "$GOBIN" ]]; then
            GOPATH_FIRST="$(go env GOPATH)"
            GOPATH_FIRST="${GOPATH_FIRST%%:*}"
            GOBIN="${GOPATH_FIRST}/bin"
          fi
          echo "$GOBIN" >> "$GITHUB_PATH"
          command -v goimports
          command -v govulncheck

      - name: Validate - go.mod/go.sum are tidy
        run: |
          set -Eeuo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Quality - format/import checks (gofmt, goimports)
        run: |
          set -Eeuo pipefail
          GO_DIRS="$(go list -f '{{.Dir}}' ./...)"
          if [[ -n "$GO_DIRS" ]]; then
            test -z "$(printf '%s\n' "$GO_DIRS" | xargs -r gofmt -l)"

            if [[ -n "${GO_MODULE:-}" ]]; then
              test -z "$(printf '%s\n' "$GO_DIRS" | xargs -r goimports -l -local "${GO_MODULE}")"
            else
              test -z "$(printf '%s\n' "$GO_DIRS" | xargs -r goimports -l)"
            fi
          fi

      - name: Quality - lint (golangci-lint)
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: golang-gin
          args: --config=.golangci.yaml ./...

      - name: Quality - static analysis (go vet)
        run: |
          set -Eeuo pipefail
          go vet ./...

      - name: Setup - system deps for race detector (CGO)
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Test - unit tests (race, shuffle) + coverage profile
        env:
          CGO_ENABLED: "1"
        run: |
          set -Eeuo pipefail
          go test ./... -race -shuffle=on -count=1 \
            -covermode=atomic -coverprofile=coverage.out

      - name: Coverage - enforce minimum statements (Go)
        env:
          GO_COVERAGE_MIN: ${{ env.GO_COVERAGE_MIN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          out = subprocess.check_output(["go", "tool", "cover", "-func=coverage.out"], text=True)
          m = re.search(r"total:\s*\(statements\)\s*([\d.]+)%", out)
          if not m:
              print("Could not parse total coverage from go tool cover output.", file=sys.stderr)
              sys.exit(2)
          pct = float(m.group(1))
          min_pct = float(os.environ.get("GO_COVERAGE_MIN", "100"))
          print(f"Go total coverage: {pct:.1f}% (min {min_pct:.1f}%)")
          sys.exit(0 if pct >= min_pct else 1)
          PY

      - name: Artifact - upload coverage profile (coverage.out)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-gin-coverage
          path: golang-gin/coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Security - vulnerability scan (govulncheck) (push + internal PRs)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -Eeuo pipefail
          govulncheck -test ./... | tee govulncheck.txt

      - name: Artifact - upload govulncheck report (push + internal PRs)
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-gin-govulncheck
          path: golang-gin/govulncheck.txt
          if-no-files-found: warn
          retention-days: 7

  java:
    name: Java / Spring Boot - Spotless, SpotBugs, tests, JaCoCo, security
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [ policy, changes ]
    if: needs.changes.outputs.java == 'true'
    defaults:
      run:
        working-directory: java-springboot
        shell: bash
    env:
      DEPENDENCY_CHECK_MAVEN_VERSION: ""
      DEPENDENCY_CHECK_FAIL_CVSS: ""
      MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow"
      ODC_DATA_DIR: "${{ github.workspace }}/.cache/dependency-check"
      ODC_CACHE_EPOCH: "unset"
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${DEPENDENCY_CHECK_MAVEN_VERSION:?DEPENDENCY_CHECK_MAVEN_VERSION is empty}"
          : "${DEPENDENCY_CHECK_FAIL_CVSS:?DEPENDENCY_CHECK_FAIL_CVSS is empty}"

      - name: Setup - JDK 25 (Temurin)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build - verify (Spotless, SpotBugs, tests, JaCoCo)
        run: |
          set -Eeuo pipefail
          mvn -B -ntp verify -Djacoco.min.ratio="${JAVA_COVERAGE_MIN_RATIO}"

      - name: Artifact - upload JaCoCo report directory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: java-springboot-jacoco
          path: java-springboot/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

      - name: Compute cache epoch (weekly)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -Eeuo pipefail
          echo "ODC_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - OWASP Dependency-Check data (push + internal PRs)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ env.ODC_DATA_DIR }}
          key: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_MAVEN_VERSION }}-${{ env.ODC_CACHE_EPOCH }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_MAVEN_VERSION }}-

      - name: Security - OWASP Dependency-Check scan (push + internal PRs)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -Eeuo pipefail
          mvn -B -ntp org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_MAVEN_VERSION}:check \
            -DfailBuildOnCVSS=${DEPENDENCY_CHECK_FAIL_CVSS} \
            -Dformats=HTML,JSON \
            -DdataDirectory="${ODC_DATA_DIR}" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Artifact - upload Dependency-Check reports (push + internal PRs)
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: java-springboot-dependency-check
          path: |
            java-springboot/target/dependency-check-report.html
            java-springboot/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Python / Django - quality, tests, coverage, security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ policy, changes ]
    if: needs.changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: python-django
        shell: bash
    env:
      PIP_AUDIT_VERSION: ""
      PIP_TOOLS_VERSION: ""
      PIP_MAX_VERSION: ""
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${PIP_TOOLS_VERSION:?PIP_TOOLS_VERSION is empty}"
          : "${PIP_MAX_VERSION:?PIP_MAX_VERSION is empty}"
          : "${PIP_AUDIT_VERSION:?PIP_AUDIT_VERSION is empty}"

      - name: Setup - Python 3.12
        id: py
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-django/requirements.lock
            python-django/requirements.test.lock

      - name: Cache - Python venv (.venv-ci)
        id: cache_venv
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: python-django/.venv-ci
          key: python-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.py.outputs.python-version }}-${{ env.PIP_TOOLS_VERSION }}-${{ env.PIP_MAX_VERSION }}-${{ hashFiles('python-django/requirements.lock', 'python-django/requirements.test.lock') }}
          restore-keys: |
            python-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.py.outputs.python-version }}-${{ env.PIP_TOOLS_VERSION }}-${{ env.PIP_MAX_VERSION }}-

      - name: Setup - ensure isolated venv exists
        run: |
          set -Eeuo pipefail
          if [[ ! -x .venv-ci/bin/python ]]; then
            python -m venv .venv-ci
          fi

      - name: Setup - ensure pip + pip-tools present
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          python -m pip install -U "pip<${PIP_MAX_VERSION}" "pip-tools==${PIP_TOOLS_VERSION}"
          command -v pip-compile

      - name: Validate - requirements.lock matches requirements.txt
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          pip-compile --no-strip-extras --generate-hashes --output-file=requirements.lock requirements.txt
          git diff --exit-code -- requirements.lock

      - name: Validate - requirements.test.lock matches requirements.test.txt
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          test -f requirements.test.txt
          pip-compile --no-strip-extras --generate-hashes --output-file=requirements.test.lock requirements.test.txt
          git diff --exit-code -- requirements.test.lock

      - name: Install - runtime + test dependencies (fully locked)
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements.test.lock

      - name: Validate - installed packages are consistent (pip check, compileall)
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          python -m pip check
          python -m compileall -q app

      - name: Quality - format check (ruff format)
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          ruff format --check .

      - name: Quality - lint (ruff)
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          ruff check .

      - name: Quality - typecheck (mypy) (PR only, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          mypy app

      - name: Quality - typecheck (mypy) (push/tags only, blocking)
        if: github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          mypy app

      - name: Test - unit tests + coverage (pytest, enforce min, write XML)
        env:
          DJANGO_SETTINGS_MODULE: django_app.settings
          PY_COVERAGE_MIN: ${{ env.PY_COVERAGE_MIN }}
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          pytest --cov --cov-report=xml --cov-fail-under="${PY_COVERAGE_MIN}"

      - name: Artifact - upload coverage report (coverage.xml)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-django-coverage
          path: python-django/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Security - vulnerability scan (pip-audit) (push + internal PRs)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -Eeuo pipefail
          . .venv-ci/bin/activate
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit -r requirements.lock --format=json --output=pip-audit.json
          pip-audit -r requirements.lock

      - name: Artifact - upload pip-audit report (push + internal PRs)
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-django-pip-audit
          path: python-django/pip-audit.json
          if-no-files-found: warn
          retention-days: 7

  docker_release:
    name: Docker - build + Trivy scan + push (tags)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [ policy, trivy_repo, go, java, python ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: johnjaysonlopez
      TRIVY_VERSION: ""
      TRIVY_CACHE_EPOCH: ""
      TRIVY_GATE_FAILED: ""
      TRIVY_GATE_ON_FINDINGS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golang-gin-app
            context: ./golang-gin
          - image: java-springboot-app
            context: ./java-springboot
          - image: python-django-app
            context: ./python-django
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty (load-tool-versions failed?)}"

      - name: Compute - Trivy cache epoch (weekly)
        run: |
          set -Eeuo pipefail
          echo "TRIVY_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - Trivy DB/cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_CACHE_EPOCH }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-

      - name: Compute - build metadata (version, build time, test flag)
        id: vars
        run: |
          set -Eeuo pipefail
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version_arg=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "run_tests_arg=true" >> "$GITHUB_OUTPUT"

      - name: Docker - compute tags and OCI labels (metadata-action)
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Auth - Docker Hub login (tags only)
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup - Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build - image (push temp tag, capture digest)
        id: build
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318 # v6.0.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUN_TESTS=${{ steps.vars.outputs.run_tests_arg }}
            SERVICE_NAME=${{ matrix.image }}
            VERSION=${{ steps.vars.outputs.version_arg }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            OCI_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            OCI_IMAGE_REVISION=${{ github.sha }}
          sbom: true
          provenance: true

      - name: Security - Trivy scan (image by digest) (table)
        id: trivy_img_table_release
        continue-on-error: true
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image-${{ matrix.image }}.txt
          exit-code: ${{ env.TRIVY_GATE_ON_FINDINGS == 'true' && '1' || '0' }}

      - name: Trivy - scan image -> SARIF
        if: always()
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.image }}.sarif
          exit-code: "0"

      - name: Upload - SARIF to GitHub Code Scanning (image)
        if: always()
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6 # v4
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-release-${{ matrix.image }}

      - name: Artifact - upload Trivy image report (table)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-image-release-${{ matrix.image }}
          path: trivy-image-${{ matrix.image }}.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - record Trivy result
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.trivy_img_table_release.outcome }}" == "failure" ]]; then
            echo "TRIVY_GATE_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "TRIVY_GATE_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: Cleanup - remove temporary ci tag from Docker Hub
        if: always() && steps.build.outcome == 'success'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set +e

          need_cmd() { command -v "$1" >/dev/null 2>&1 || { echo "WARN: missing $1; skipping cleanup." >&2; return 1; }; }
          need_cmd curl || exit 0
          need_cmd jq || exit 0

          repo="${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}"
          tag="ci-${{ github.sha }}"

          retry() {
            local n=1 max=5 base_delay=2
            while (( n <= max )); do
              if "$@"; then
                return 0
              fi
              sleep $((base_delay * n))
              n=$((n + 1))
            done
            return 1
          }

          get_token() {
            curl -fsSL -H "Content-Type: application/json" \
              -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_PASS}\"}" \
              https://hub.docker.com/v2/users/login/ \
              | jq -r '.token'
          }

          delete_tag() {
            local token="$1"
            curl -fsSL -X DELETE \
              -H "Authorization: JWT ${token}" \
              "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/"
          }

          token="$(retry get_token)"
          if [[ -n "${token:-}" && "${token}" != "null" ]]; then
            retry delete_tag "$token" || true
          else
            echo "Docker Hub API token unavailable; skipping cleanup."
          fi

      - name: Gate - fail if Trivy image scan found HIGH/CRITICAL
        if: env.TRIVY_GATE_ON_FINDINGS == 'true' && env.TRIVY_GATE_FAILED == 'true'
        run: |
          set -Eeuo pipefail
          exit 1

      - name: Promote - apply release tags to scanned digest
        run: |
          set -Eeuo pipefail
          image="${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}"
          digest="${{ steps.build.outputs.digest }}"

          echo "Promoting ${image}@${digest} to:"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | tr ',\n' '\n' | sed '/^[[:space:]]*$/d'

          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create -t "$tag" "${image}@${digest}"
          done < <(printf '%s\n' "${{ steps.meta.outputs.tags }}" | tr ',\n' '\n' | sed '/^[[:space:]]*$/d')
