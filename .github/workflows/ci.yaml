name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  schedule:
    - cron: "00 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI_MAINTAINERS: "johnjaysonlpz otheruser"

jobs:
  changes:
    name: Changes - detect touched areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.tag.outputs.all == 'true' || steps.paths.outputs.ci == 'true' }}
      security: ${{ steps.tag.outputs.all == 'true' || steps.paths.outputs.security == 'true' || steps.paths.outputs.ci == 'true' }}
      golang: ${{ steps.tag.outputs.all == 'true' || steps.paths.outputs.golang == 'true' || steps.paths.outputs.ci == 'true' }}
      java: ${{ steps.tag.outputs.all == 'true' || steps.paths.outputs.java == 'true' || steps.paths.outputs.ci == 'true' }}
      python: ${{ steps.tag.outputs.all == 'true' || steps.paths.outputs.python == 'true' || steps.paths.outputs.ci == 'true' }}
    steps:
      - name: Detect - tag release or manual run (force run)
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (push/PR)
        if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && steps.tag.outputs.all != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter - changed paths
        id: paths
        if: ${{ steps.tag.outputs.all != 'true' && github.event_name != 'schedule' }}
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.ci-tool-versions.sh'
              - '.ci-local.sh'
            golang:
              - 'golang-gin/**'
            java:
              - 'java-springboot/**'
            python:
              - 'python-django/**'
            security:
              - 'golang-gin/**'
              - 'java-springboot/**'
              - 'python-django/**'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.ci-tool-versions.sh'
              - '.ci-local.sh'

  policy:
    name: Policy - protect CI control files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block PRs that modify CI control files (GitHub API)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          actor="${{ github.actor }}"
          maintainers="${CI_MAINTAINERS:-}"
          maintainers="$(echo "$maintainers" | tr '\n\t' '  ' | xargs)"

          if echo " $maintainers " | grep -Fq " $actor "; then
            echo "Maintainer bypass: $actor"
            exit 0
          fi

          protected_regex='^(\.ci-tool-versions\.sh|\.ci-local\.sh|\.github/workflows/.*\.ya?ml|\.github/actions/.*\.ya?ml)$'

          page=1
          changed=""
          while :; do
            resp="$(curl -sSf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")"

            files="$(echo "$resp" | jq -r '.[].filename' || true)"
            [[ -z "${files// }" ]] && break

            changed+="${files}"$'\n'

            count="$(echo "$resp" | jq 'length')"
            [[ "$count" -lt 100 ]] && break
            page=$((page+1))
          done

          if echo "$changed" | grep -E "$protected_regex" >/dev/null; then
            echo "ERROR: This PR modifies protected CI control files:"
            echo "$changed" | grep -E "$protected_regex" || true
            echo
            echo "Please open a separate PR or request maintainer assistance."
            exit 1
          fi

          echo "OK: no protected CI control files modified."

      - name: Policy - noop (non-PR)
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Policy check skipped (not a PR)."

  trivy_repo:
    name: Security - Trivy (repo) + SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ policy ]
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: ""
      TRIVY_CACHE_EPOCH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty (load-tool-versions failed?)}"

      - name: Compute - Trivy cache epoch (weekly)
        shell: bash
        run: echo "TRIVY_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - Trivy DB/cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_CACHE_EPOCH }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-

      - name: Security - Trivy scan (fs) (table, gate HIGH/CRITICAL)
        id: trivy_repo_table
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-repo.txt
          exit-code: "1"
          skip-dirs: .git,.cache

      - name: Security - Trivy scan (fs) -> SARIF (for Code Scanning)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-repo.sarif
          exit-code: "0"
          skip-dirs: .git,.cache

      - name: Upload - SARIF to GitHub Code Scanning (repo)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

      - name: Artifact - upload Trivy repo report (table)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-repo
          path: trivy-repo.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - fail if Trivy repo scan found HIGH/CRITICAL
        if: steps.trivy_repo_table.outcome == 'failure'
        shell: bash
        run: exit 1

  go:
    name: Go / Gin - quality, tests, security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ policy, changes ]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.golang == 'true' }}
    defaults:
      run:
        working-directory: golang-gin
    env:
      GOIMPORTS_VERSION: ""
      GOVULNCHECK_VERSION: ""
      GOLANGCI_LINT_VERSION: ""
      GO_MODULE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GOIMPORTS_VERSION:?GOIMPORTS_VERSION is empty}"
          : "${GOVULNCHECK_VERSION:?GOVULNCHECK_VERSION is empty}"
          : "${GOLANGCI_LINT_VERSION:?GOLANGCI_LINT_VERSION is empty}"

      - name: Security - dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Setup - Go toolchain
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: golang-gin/go.mod
          cache-dependency-path: golang-gin/go.sum
          check-latest: true

      - name: Cache - Go tools (goimports, govulncheck)
        id: cache_go_tools
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ env.GOIMPORTS_VERSION }}-${{ env.GOVULNCHECK_VERSION }}

      - name: Setup - install Go dev tools (goimports, govulncheck)
        if: steps.cache_go_tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Setup - add Go tools to PATH
        shell: bash
        run: |
          GOBIN="$(go env GOBIN)"
          if [[ -z "$GOBIN" ]]; then
            GOPATH_FIRST="$(go env GOPATH)"
            GOPATH_FIRST="${GOPATH_FIRST%%:*}"
            GOBIN="${GOPATH_FIRST}/bin"
          fi
          echo "$GOBIN" >> "$GITHUB_PATH"
          command -v goimports
          command -v govulncheck

      - name: Validate - go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Quality - format/import checks (gofmt, goimports)
        shell: bash
        run: |
          GO_DIRS="$(go list -f '{{.Dir}}' ./...)"
          if [[ -n "$GO_DIRS" ]]; then
            test -z "$(printf '%s\n' "$GO_DIRS" | xargs -r gofmt -l)"
            test -z "$(printf '%s\n' "$GO_DIRS" | xargs -r goimports -l -local "${GO_MODULE}")"
          fi

      - name: Quality - lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: golang-gin
          args: --config=.golangci.yaml ./...

      - name: Quality - static analysis (go vet)
        run: go vet ./...

      - name: Setup - system deps for race detector (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Test - unit tests (race, shuffle) + coverage profile
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./... -race -shuffle=on -count=1 \
            -covermode=atomic -coverprofile=coverage.out

      - name: Coverage - enforce 100% statements (Go)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.check_output(["go", "tool", "cover", "-func=coverage.out"], text=True)
          m = re.search(r"total:\s*\(statements\)\s*([\d.]+)%", out)
          if not m:
              print("Could not parse total coverage from go tool cover output.", file=sys.stderr)
              sys.exit(2)
          pct = float(m.group(1))
          print(f"Go total coverage: {pct:.1f}%")
          sys.exit(0 if pct >= 100.0 else 1)
          PY

      - name: Artifact - upload coverage profile (coverage.out)
        uses: actions/upload-artifact@v6
        with:
          name: go-gin-coverage
          path: golang-gin/coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Security - vulnerability scan (govulncheck) (push/tags only)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          govulncheck -test ./... | tee govulncheck.txt

      - name: Artifact - upload govulncheck report (push/tags only)
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v6
        with:
          name: go-gin-govulncheck
          path: golang-gin/govulncheck.txt
          if-no-files-found: warn
          retention-days: 7

  java:
    name: Java / Spring Boot - Spotless, SpotBugs, tests, JaCoCo, security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [ policy, changes ]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.java == 'true' }}
    defaults:
      run:
        working-directory: java-springboot
    env:
      DEPENDENCY_CHECK_MAVEN_VERSION: ""
      DEPENDENCY_CHECK_FAIL_CVSS: ""
      MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow"
      ODC_DATA_DIR: "${{ github.workspace }}/.cache/dependency-check"
      ODC_CACHE_EPOCH: "unset"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPENDENCY_CHECK_MAVEN_VERSION:?DEPENDENCY_CHECK_MAVEN_VERSION is empty}"
          : "${DEPENDENCY_CHECK_FAIL_CVSS:?DEPENDENCY_CHECK_FAIL_CVSS is empty}"

      - name: Security - dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Setup - JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build - verify (Spotless, SpotBugs, tests, JaCoCo)
        run: mvn -B -ntp verify

      - name: Artifact - upload JaCoCo report directory
        uses: actions/upload-artifact@v6
        with:
          name: java-springboot-jacoco
          path: java-springboot/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

      - name: Compute cache epoch (weekly)
        if: github.event_name == 'push'
        shell: bash
        run: echo "ODC_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - OWASP Dependency-Check data (push/tags only)
        if: github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: ${{ env.ODC_DATA_DIR }}
          key: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_MAVEN_VERSION }}-${{ env.ODC_CACHE_EPOCH }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_MAVEN_VERSION }}-

      - name: Security - OWASP Dependency-Check scan (push/tags only)
        if: github.event_name == 'push'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_MAVEN_VERSION}:check \
            -DfailBuildOnCVSS=${DEPENDENCY_CHECK_FAIL_CVSS} \
            -Dformats=HTML,JSON \
            -DdataDirectory="${ODC_DATA_DIR}" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Artifact - upload Dependency-Check reports (push/tags only)
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v6
        with:
          name: java-springboot-dependency-check
          path: |
            java-springboot/target/dependency-check-report.html
            java-springboot/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Python / Django - quality, tests, coverage, security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ policy, changes ]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.python == 'true' }}
    defaults:
      run:
        working-directory: python-django
    env:
      PIP_AUDIT_VERSION: ""
      PIP_TOOLS_VERSION: ""
      PIP_MAX_VERSION: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PIP_TOOLS_VERSION:?PIP_TOOLS_VERSION is empty}"
          : "${PIP_MAX_VERSION:?PIP_MAX_VERSION is empty}"
          : "${PIP_AUDIT_VERSION:?PIP_AUDIT_VERSION is empty}"

      - name: Security - dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Setup - Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-django/requirements.lock
            python-django/requirements.test.txt

      - name: Cache - Python venv (.venv-ci)
        id: cache_venv
        uses: actions/cache@v5
        with:
          path: python-django/.venv-ci
          key: python-venv-${{ runner.os }}-py312-${{ env.PIP_TOOLS_VERSION }}-${{ env.PIP_MAX_VERSION }}-${{ hashFiles('python-django/requirements.lock', 'python-django/requirements.test.txt') }}
          restore-keys: |
            python-venv-${{ runner.os }}-py312-${{ env.PIP_TOOLS_VERSION }}-${{ env.PIP_MAX_VERSION }}-

      - name: Setup - create isolated venv + install pip-tools (cache miss)
        if: steps.cache_venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install -U "pip<${PIP_MAX_VERSION}" "pip-tools==${PIP_TOOLS_VERSION}"

      - name: Validate - requirements.lock matches requirements.txt
        run: |
          . .venv-ci/bin/activate
          pip-compile --no-strip-extras --generate-hashes --output-file=requirements.lock requirements.txt
          git diff --exit-code -- requirements.lock

      - name: Install - runtime + test dependencies (locked) (cache miss)
        if: steps.cache_venv.outputs.cache-hit != 'true'
        run: |
          . .venv-ci/bin/activate
          python -m pip install -U "pip<${PIP_MAX_VERSION}"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements.test.txt

      - name: Validate - installed packages are consistent (pip check, compileall)
        run: |
          . .venv-ci/bin/activate
          python -m pip check
          python -m compileall -q app

      - name: Quality - format check (ruff format)
        run: |
          . .venv-ci/bin/activate
          ruff format --check .

      - name: Quality - lint (ruff)
        run: |
          . .venv-ci/bin/activate
          ruff check .

      - name: Quality - typecheck (mypy) (PR only, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          . .venv-ci/bin/activate
          mypy app

      - name: Quality - typecheck (mypy) (push/tags only, blocking)
        if: github.event_name == 'push'
        run: |
          . .venv-ci/bin/activate
          mypy app

      - name: Test - unit tests + coverage (pytest, enforce 100%, write XML)
        env:
          DJANGO_SETTINGS_MODULE: django_app.settings
        run: |
          . .venv-ci/bin/activate
          pytest --cov --cov-report=xml --cov-fail-under=100

      - name: Artifact - upload coverage report (coverage.xml)
        uses: actions/upload-artifact@v6
        with:
          name: python-django-coverage
          path: python-django/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Security - vulnerability scan (pip-audit) (push/tags only)
        if: github.event_name == 'push'
        run: |
          . .venv-ci/bin/activate
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit -r requirements.lock --format=json --output=pip-audit.json
          pip-audit -r requirements.lock

      - name: Artifact - upload pip-audit report (push/tags only)
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v6
        with:
          name: python-django-pip-audit
          path: python-django/pip-audit.json
          if-no-files-found: warn
          retention-days: 7

  docker_weekly:
    name: Docker - build + Trivy scan (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ policy ]
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: ""
      TRIVY_CACHE_EPOCH: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golang-gin-app
            context: ./golang-gin
          - image: java-springboot-app
            context: ./java-springboot
          - image: python-django-app
            context: ./python-django
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty (load-tool-versions failed?)}"

      - name: Compute - Trivy cache epoch (weekly)
        shell: bash
        run: echo "TRIVY_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - Trivy DB/cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_CACHE_EPOCH }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-

      - name: Setup - Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build - image (local for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUN_TESTS=false
            SERVICE_NAME=${{ matrix.image }}
            VERSION=weekly
            BUILD_TIME=${{ github.run_id }}
            OCI_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            OCI_IMAGE_REVISION=${{ github.sha }}

      - name: Security - Trivy scan (image) (table, gate HIGH/CRITICAL)
        id: trivy_img_table_weekly
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: local/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image-${{ matrix.image }}.txt
          exit-code: "1"

      - name: Trivy - scan image -> SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: local/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.image }}.sarif
          exit-code: "0"

      - name: Upload - SARIF to GitHub Code Scanning (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

      - name: Artifact - upload Trivy image report (table)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-${{ matrix.image }}
          path: trivy-image-${{ matrix.image }}.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - fail if Trivy image scan found HIGH/CRITICAL
        if: steps.trivy_img_table_weekly.outcome == 'failure'
        shell: bash
        run: exit 1

  docker_release:
    name: Docker - build + Trivy scan + push (tags)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ policy, trivy_repo, go, java, python ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      security-events: write
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: johnjaysonlopez
      TRIVY_VERSION: ""
      TRIVY_CACHE_EPOCH: ""
      TRIVY_GATE_FAILED: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: golang-gin-app
            context: ./golang-gin
          - image: java-springboot-app
            context: ./java-springboot
          - image: python-django-app
            context: ./python-django
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty (load-tool-versions failed?)}"

      - name: Compute - Trivy cache epoch (weekly)
        shell: bash
        run: echo "TRIVY_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - Trivy DB/cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_CACHE_EPOCH }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-

      - name: Compute - build metadata (version, build time, test flag)
        id: vars
        shell: bash
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version_arg=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "run_tests_arg=true" >> "$GITHUB_OUTPUT"

      - name: Docker - compute tags and OCI labels (metadata-action)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Auth - Docker Hub login (tags only)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup - Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build - image (push temp tag, capture digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUN_TESTS=${{ steps.vars.outputs.run_tests_arg }}
            SERVICE_NAME=${{ matrix.image }}
            VERSION=${{ steps.vars.outputs.version_arg }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            OCI_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            OCI_IMAGE_REVISION=${{ github.sha }}
          sbom: true
          provenance: true

      - name: Security - Trivy scan (image by digest) (table, gate HIGH/CRITICAL)
        id: trivy_img_table_release
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image-${{ matrix.image }}.txt
          exit-code: "1"

      - name: Trivy - scan image -> SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.image }}.sarif
          exit-code: "0"

      - name: Upload - SARIF to GitHub Code Scanning (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

      - name: Artifact - upload Trivy image report (table)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-${{ matrix.image }}
          path: trivy-image-${{ matrix.image }}.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - record Trivy result
        shell: bash
        run: |
          if [[ "${{ steps.trivy_img_table_release.outcome }}" == "failure" ]]; then
            echo "TRIVY_GATE_FAILED=true" >> "$GITHUB_ENV"
          else
            echo "TRIVY_GATE_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: Cleanup - remove temporary ci tag from Docker Hub (best-effort)
        if: env.TRIVY_GATE_FAILED == 'true'
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set +e
          repo="${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}"
          tag="ci-${{ github.sha }}"

          token="$(curl -sSf -H "Content-Type: application/json" \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_PASS}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token' 2>/dev/null)"

          if [[ -n "${token:-}" && "${token}" != "null" ]]; then
            curl -sSf -X DELETE \
              -H "Authorization: JWT ${token}" \
              "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/" || true
          else
            echo "Docker Hub API token unavailable; skipping cleanup."
          fi

      - name: Gate - fail if Trivy image scan found HIGH/CRITICAL
        if: env.TRIVY_GATE_FAILED == 'true'
        shell: bash
        run: exit 1

      - name: Promote - apply release tags to scanned digest
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}"
          digest="${{ steps.build.outputs.digest }}"

          echo "Promoting ${image}@${digest} to:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create -t "$tag" "${image}@${digest}"
          done < <(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n')
