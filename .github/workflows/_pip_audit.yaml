name: _security_pip_audit

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      gate:
        type: boolean
        required: true
      artifact_name:
        type: string
        required: false
        default: python-django-pip-audit

permissions:
  contents: read

jobs:
  pip_audit:
    name: Security - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
        shell: bash
    env:
      PIP_AUDIT_VERSION: ""
      PIP_MAX_VERSION: ""
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${PIP_AUDIT_VERSION:?PIP_AUDIT_VERSION is empty}"
          : "${PIP_MAX_VERSION:?PIP_MAX_VERSION is empty}"
          test -f requirements.lock

      - name: Setup - Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working_directory }}/requirements.lock

      - name: Setup - venv + install pip-audit
        run: |
          set -Eeuo pipefail
          python -m venv .venv-audit
          . .venv-audit/bin/activate
          python -m pip install -U "pip<${PIP_MAX_VERSION}"
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Security - pip-audit (locked deps)
        id: audit
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          . .venv-audit/bin/activate
          pip-audit -r requirements.lock --format=json --output=pip-audit.json
          pip-audit -r requirements.lock

      - name: Artifact - upload pip-audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/pip-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - fail if pip-audit found issues
        if: ${{ inputs.gate && steps.audit.outcome == 'failure' }}
        run: |
          set -Eeuo pipefail
          exit 1
