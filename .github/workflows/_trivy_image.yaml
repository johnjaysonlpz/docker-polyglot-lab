name: _security_trivy_image

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: true
      image_ref:
        type: string
        required: true
      service_name:
        type: string
        required: false
        default: ""
      gate_on_findings:
        type: boolean
        required: true
      upload_sarif:
        type: boolean
        required: true
      artifact_name:
        type: string
        required: false
        default: trivy-image
      sarif_category:
        type: string
        required: false
        default: trivy-image
      mode:
        type: string
        required: true # "local" | "digest"
      digest:
        type: string
        required: false

permissions:
  contents: read

jobs:
  trivy_image:
    name: Security - Trivy (image) + SARIF
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    env:
      TRIVY_VERSION: ""
      TRIVY_CACHE_EPOCH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup - load pinned tool versions
        uses: ./.github/actions/load-tool-versions

      - name: Validate - tool versions loaded
        run: |
          set -Eeuo pipefail
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty (load-tool-versions failed?)}"

      - name: Compute - Trivy cache epoch (weekly)
        run: |
          set -Eeuo pipefail
          echo "TRIVY_CACHE_EPOCH=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache - Trivy DB/cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_CACHE_EPOCH }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-

      - name: Setup - Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build - image (local for scan)
        if: ${{ inputs.mode == 'local' }}
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318 # v6.0.0
        with:
          context: ${{ inputs.context }}
          load: true
          tags: ${{ inputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUN_TESTS=false
            SERVICE_NAME=${{ inputs.service_name != '' && inputs.service_name || inputs.image_ref }}
            VERSION=weekly
            BUILD_TIME=${{ github.run_id }}
            OCI_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            OCI_IMAGE_REVISION=${{ github.sha }}

      - name: Compute - scan ref
        id: scanref
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.mode }}" == "digest" ]]; then
            test -n "${{ inputs.digest }}"
            echo "ref=${{ inputs.image_ref }}@${{ inputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.image_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Security - Trivy scan (image) (table)
        id: trivy_img_table
        continue-on-error: true
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ steps.scanref.outputs.ref }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          exit-code: ${{ inputs.gate_on_findings && '1' || '0' }}

      - name: Trivy - scan image -> SARIF
        if: ${{ inputs.upload_sarif && always() }}
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scan-type: image
          scan-ref: ${{ steps.scanref.outputs.ref }}
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload - SARIF to GitHub Code Scanning (image)
        if: ${{ inputs.upload_sarif && always() }}
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6 # v4
        with:
          sarif_file: trivy-image.sarif
          category: ${{ inputs.sarif_category }}

      - name: Artifact - upload Trivy image report (table)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: trivy-image.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate - fail if Trivy image scan found HIGH/CRITICAL
        if: ${{ inputs.gate_on_findings && steps.trivy_img_table.outcome == 'failure' }}
        run: |
          set -Eeuo pipefail
          exit 1
